name: ComputedViewsDemo
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  ComputedViewsDemo:
    type: application
    platform: iOS
    sources:
      - Sources/ComputedViewsDemo
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ComputedViewsDemo
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  ComputedViewsDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/ComputedViewsDemoTests
    dependencies:
      - target: ComputedViewsDemo
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ComputedViewsDemoTests
        CODE_SIGN_STYLE: Automatic
schemes:
  ComputedViewsDemo:
    build:
      targets:
        ComputedViewsDemo: all
        ComputedViewsDemoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ComputedViewsDemoTests
